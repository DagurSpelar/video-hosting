<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Peter – Play Fortnite</title>

    <style>
        body {
            background: #0b0b0b;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            color: white;
        }

        .button {
            background: #4c67ff;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            background: #3549d5;
        }
    </style>
</head>
<body>

    <h1>Dancing Peter</h1>
    <p>Press play to launch Fortnite and load the island automatically.</p>

    <!-- THE PLAY BUTTON -->
    <button class="button" onclick="playFortnite()">Play Now</button>


<script>
function playFortnite() {

    // 1️⃣ Attempt to launch Fortnite using Epic Games Launcher
    window.location.href =
        "com.epicgames.launcher://apps/Fortnite?action=launch&silent=true&args=-EpicPortal&args=-IslandOverride=1832-0431-4852";

    // 2️⃣ Open your DownloadOrNot check page in a NEW TAB
    window.open("https://dagurspelar.github.io/DownloadOrNot/", "_blank");
}
</script>

</body>
</html>
